[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jurigraph"
version = "0.1.0"
description = "Assistente de pesquisa jurídica com GraphRAG e KAG sobre Neo4j"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=6.4,<7",
  "neo4j-graphrag[openai,sentence-transformers]>=1.24,<2",
  "graphdatascience>=2.3,<3",
  "streamlit>=1.67,<2",
  "neo4j-viz>=1.13,<2",
  "rapidfuzz>=3.14,<4",
  "networkx>=3.7,<4",
  "pydantic-settings>=2.6,<3",
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jurigraph-setup = "jurigraph.schema.setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "neo4j: precisa do Neo4j rodando (docker compose up -d neo4j)",
  "llm: chama o provedor de LLM e gasta tokens",
]
